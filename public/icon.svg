<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDF4ED" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#7C2D12" flood-opacity="0.35" />
    </filter>
    <filter id="innerGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#clayShadow)" />
  
  <!-- Highlight reflection on squircle -->
  <path d="M 64 120 C 64 64, 120 48, 256 48 C 392 48, 448 64, 448 120 C 448 140, 360 110, 256 110 C 152 110, 64 140, 64 120 Z" fill="#FFFFFF" opacity="0.25" />

  <!-- Center Clay Card -->
  <rect x="100" y="100" width="312" height="312" rx="64" fill="url(#cardGrad)" filter="url(#innerGlow)" />

  <!-- Productivity Checkmark Circle -->
  <circle cx="200" cy="220" r="54" fill="url(#accentGrad)" />
  <path d="M 175 220 L 192 238 L 226 200" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Finance Coin / Wallet Emblem -->
  <circle cx="304" cy="296" r="48" fill="#F59E0B" />
  <circle cx="304" cy="296" r="38" fill="none" stroke="#FEF3C7" stroke-width="4" />
  <text x="304" y="307" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#78350F" text-anchor="middle">Rp</text>

  <!-- Decorative Sparkles -->
  <circle cx="330" cy="160" r="10" fill="#EA580C" opacity="0.8" />
  <circle cx="160" cy="330" r="8" fill="#EA580C" opacity="0.6" />
</svg>
